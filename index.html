<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Книги на слух</title>
<meta name="description" content="Тренажёр английского: фразы на автомате, слова с ассоциациями, законы слов, техники памяти и книги на слух.">
<meta name="theme-color" content="#2B5870">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="На слух">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="trainer/trainer.css">
<script type="module" src="trainer/main.js"></script>
</head>
<body>
<div class="app">
  <header class="top gut">
    <button class="icon" id="back" aria-label="Назад" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 id="title">Сегодня</h1>
    <div class="stats" id="stats"></div>
  </header>
  <main class="main gut" id="main"></main>
  <nav class="nav" id="nav" aria-label="Разделы">
    <button data-tab="today" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сегодня</button>
    <button data-tab="phrases"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>Фразы</button>
    <button data-tab="words"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>Слова</button>
    <button data-tab="laws"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Законы</button>
    <button data-tab="memory"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Память</button>
  </nav>
</div>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
